<VirtualHost *:80>
	ServerName www.example.com
	DocumentRoot /var/www/html

	RewriteEngine On
	AcceptPathInfo On
	LimitRequestBody 83886080

	# Caddy termina TLS y reenvía por HTTP. Estas líneas hacen que OJS
	# detecte la petición como HTTPS y no entre en un bucle de redirección.
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride all
		Require all granted

		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	<Directory /var/www/html/public>
		php_flag engine off
	</Directory>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:443>
	ServerName www.example.com
	DocumentRoot /var/www/html

	RewriteEngine On
	AcceptPathInfo On
	LimitRequestBody 83886080

	SSLEngine On
	SSLCertificateFile /etc/ssl/apache2/server.pem
	SSLCertificateKeyFile /etc/ssl/apache2/server.key

	SetEnv HTTPS On
	PassEnv HTTPS
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride all
		Require all granted

		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	<Directory /var/www/html/public>
		php_flag engine off
	</Directory>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
